<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Deluxe - Cassino Royale ADS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <!-- Estilos do jogo -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-2 sm:p-4">

    <!-- CABEÇALHO DO CASSINO -->
    <header class="max-w-5xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between gap-3 p-3 bg-emerald-950/80 border border-amber-500/30 rounded-2xl backdrop-blur-md shadow-xl">
        <div class="flex items-center gap-3">
            <div class="bg-amber-500 text-slate-950 p-2.5 rounded-xl shadow-lg">
                <!-- CORREÇÃO: o ícone certo do FontAwesome é fa-club (no singular) -->
                <i class="fa-solid fa-club text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-black font-serif-title tracking-wider text-amber-400 uppercase">
                    Blackjack Royale
                </h1>
            </div>
        </div>

        <!-- ESTATÍSTICAS, SALDO E DÍVIDA -->
        <div class="flex items-center gap-3 sm:gap-5 bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700/50">
            <div class="text-center">
                <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider">Vitórias</span>
                <span id="statVitorias" class="text-base font-bold text-emerald-400">0</span>
            </div>
            <div class="h-6 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider">Derrotas</span>
                <span id="statDerrotas" class="text-base font-bold text-rose-400">0</span>
            </div>
            <div class="h-6 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="block text-[10px] text-rose-400 font-bold uppercase tracking-wider">Dívida</span>
                <span class="text-base font-black text-rose-400">$<span id="dividaAtual">0</span></span>
            </div>
            <div class="h-6 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="block text-[10px] text-amber-400/90 font-bold uppercase tracking-wider">Pé-de-Meia</span>
                <span class="text-lg font-black text-amber-400">$<span id="saldoAtual">1000</span></span>
            </div>
        </div>
    </header>

    <!-- MESA DE JOGO PRINCIPAL -->
    <main class="max-w-5xl mx-auto w-full my-3 flex-1 flex flex-col justify-between casino-felt wooden-border rounded-3xl p-4 sm:p-8 relative overflow-hidden min-h-[460px]">

        <!-- MENSAGEM DE STATUS / NOTIFICAÇÕES FLOATING -->
        <div id="painelMensagem" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-none transition-all duration-300 opacity-0 scale-95 w-11/12 max-w-md text-center">
            <div id="mensagemBox" class="bg-slate-950/95 border-2 border-amber-500 text-amber-300 p-4 sm:p-6 rounded-2xl shadow-2xl backdrop-blur-md pointer-events-auto">
                <h2 id="mensagemTitulo" class="text-2xl sm:text-3xl font-black font-serif-title uppercase mb-1">VOCÊ VENCEU!</h2>
                <p id="mensagemSub" class="text-sm sm:text-base text-slate-300 mb-4">A Banca estourou 21 pontos.</p>
                <button onclick="esconderNotificacao()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs uppercase tracking-wider">
                    Continuar / Limpar Mesa
                </button>
            </div>
        </div>

        <!-- ÁREA DA BANCA (DEALER) -->
        <section class="flex flex-col items-center gap-2 z-10">
            <div class="flex items-center gap-3 bg-black/40 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-sm">
                <i class="fa-solid fa-user-tie text-amber-400"></i>
                <span class="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-200">Banca (Dealer)</span>
                <span id="pontosBanca" class="bg-amber-500 text-slate-950 px-2.5 py-0.5 rounded-full text-xs font-black">0</span>
            </div>

            <!-- Cartas da Banca -->
            <div id="cartasBanca" class="flex flex-wrap justify-center gap-2 sm:gap-3 min-h-[120px] sm:min-h-[145px] items-center p-2">
            </div>
        </section>

        <!-- POT / APOSTA DA RODADA ATUAL -->
        <!-- CORREÇÃO: o botão de empréstimo saiu daqui (ficava embaixo do painel de mensagens) e foi para o rodapé -->
        <div class="my-2 text-center z-10 flex flex-col items-center gap-2">
            <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/40 px-4 py-1.5 rounded-full backdrop-blur-md">
                <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
                <span class="text-xs font-semibold text-amber-200 uppercase tracking-wider">Aposta na Mesa:</span>
                <span class="text-base font-black text-amber-400">$<span id="apostaAtual">0</span></span>
            </div>
        </div>

        <!-- ÁREA DO JOGADOR -->
        <section class="flex flex-col items-center gap-2 z-10">
            <!-- Cartas do Jogador -->
            <div id="cartasJogador" class="flex flex-wrap justify-center gap-2 sm:gap-3 min-h-[120px] sm:min-h-[145px] items-center p-2">
            </div>

            <div class="flex items-center gap-3 bg-black/40 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-sm">
                <i class="fa-solid fa-user text-emerald-400"></i>
                <span class="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-200">Sua Mão</span>
                <span id="pontosJogador" class="bg-emerald-500 text-slate-950 px-2.5 py-0.5 rounded-full text-xs font-black">0</span>
            </div>
        </section>

    </main>

    <!-- PAINEL DE CONTROLES E APOSTAS -->
    <footer class="max-w-5xl mx-auto w-full bg-slate-950/90 border border-slate-800 rounded-2xl p-3 sm:p-4 backdrop-blur-md shadow-2xl flex flex-col md:flex-row items-center justify-between gap-4">

        <!-- SELEÇÃO DE FICHAS DE APOSTA -->
        <div class="flex flex-col items-center md:items-start gap-1.5 w-full md:w-auto">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Selecione suas Fichas:</span>
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="adicionarAposta(10)" class="chip chip-10" title="Apostar $10">$10</button>
                <button onclick="adicionarAposta(25)" class="chip chip-25" title="Apostar $25">$25</button>
                <button onclick="adicionarAposta(50)" class="chip chip-50" title="Apostar $50">$50</button>
                <button onclick="adicionarAposta(100)" class="chip chip-100" title="Apostar $100">$100</button>
                <button onclick="limparAposta()" id="btnLimparAposta" class="bg-slate-800 hover:bg-slate-700 text-rose-400 p-2.5 rounded-full transition-colors text-xs font-bold ml-1 border border-slate-700" title="Zerar Aposta">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>

            <!-- BOTÃO DE EMPRÉSTIMO (agora no rodapé, fora da área coberta pelas notificações) -->
            <button id="btnEmprestimo" onclick="solicitarEmprestimo()" class="hidden bg-red-600 hover:bg-red-500 text-white font-black px-4 py-1.5 rounded-full text-xs uppercase tracking-wider shadow-lg transition-colors border border-red-400 animate-pulse cursor-pointer">
                <i class="fa-solid fa-hand-holding-dollar"></i> Vender o Rim ($500)
            </button>
        </div>

        <!-- BOTÕES DE JOGADA -->
        <div class="flex items-center justify-center gap-2 sm:gap-3 w-full md:w-auto">
            <button id="btnPedir" onclick="pedirCarta()" disabled class="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-white font-black text-sm uppercase tracking-wider shadow-lg transition-all flex items-center justify-center gap-2 border border-emerald-400/30">
                <i class="fa-solid fa-hand-holding"></i> Mais Uma!
            </button>

            <button id="btnParar" onclick="parar()" disabled class="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-white font-black text-sm uppercase tracking-wider shadow-lg transition-all flex items-center justify-center gap-2 border border-amber-400/30">
                <i class="fa-solid fa-hand"></i> Amarelei
            </button>

            <button id="btnNovoJogo" onclick="iniciarRodada()" class="flex-1 sm:flex-none px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-black text-sm uppercase tracking-wider shadow-xl transition-all flex items-center justify-center gap-2 border border-yellow-300">
                <i class="fa-solid fa-play"></i> Dar Cartas
            </button>
        </div>

    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script src="js/script.js"></script>
</body>
</html>
